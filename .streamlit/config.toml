[theme]
primaryColor = "#005CFD"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#04133A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# "viewer": esconde o botão Deploy e as opções de desenvolvedor (rerun, limpar cache); mantém o menu do visitante.
# Não afeta o botão de abrir/fechar a barra lateral.
toolbarMode = "viewer"
