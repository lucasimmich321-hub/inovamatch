[theme]
primaryColor = "#005CFD"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#04133A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false

[client]
# "minimal": sem menu de três pontinhos (Print, Record screen, "Made with Streamlit") e sem Deploy (Streamlit 1.67).
# Não afeta o botão de abrir/fechar a barra lateral.
toolbarMode = "minimal"
